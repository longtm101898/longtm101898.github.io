<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Long Tran</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: 'Atkinson Hyperlegible Next';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/atkinson-hyperlegible-next-latin.woff2') format('woff2');
      }
      :root {
        color-scheme: light dark;
        --paper: #f2f5fa;
        --ink: #0c1a3f;
        --navy: #0c1a3f;
        --on-ink: #fff;
        --cobalt: #2743d3;
        --signal: #ffcb2e;
        --mute: #4f5b7a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #070c1f;
          --ink: #eef1fa;
          --on-ink: #070c1f;
          --cobalt: #8fa3ff;
          --mute: #a6b1cf;
        }
      }
      body {
        display: grid;
        place-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        font-family:
          'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui,
          sans-serif;
        line-height: 1.5;
        color: var(--ink);
        background: var(--paper);
      }
      main {
        max-width: 34rem;
      }
      p {
        margin: 0;
      }
      .code {
        font-weight: 800;
        color: var(--mute);
      }
      h1 {
        margin: 0.25rem 0 0.75rem;
        font-size: clamp(2.5rem, 9vw, 4.5rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.035em;
        color: var(--cobalt);
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem; /* 44px target */
        margin-top: 1.5rem;
        padding: 0 1.25rem;
        font-weight: 600;
        text-decoration: none;
        color: var(--on-ink);
        background: var(--ink);
        border-radius: 0.375rem;
      }
      a:focus-visible {
        outline: 3px solid var(--signal);
        outline-offset: 0;
        box-shadow: 0 0 0 6px var(--navy);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p>
        This address does not exist on Long Tran's portfolio. The whole site is
        one page, so everything is on the home page.
      </p>
      <a href="/">Go to the home page</a>
    </main>
  </body>
</html>
